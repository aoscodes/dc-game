name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Force deploy all components regardless of changed paths"
        type: boolean
        default: false

jobs:
  # Detect which parts of the codebase changed so downstream jobs can skip
  # work that isn't needed.  dorny/paths-filter compares the push against the
  # previous commit on the branch (or the merge-base for PRs).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      web: ${{ steps.filter.outputs.web }}
      setup: ${{ steps.filter.outputs.setup }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The workflow file itself is a dependency of every artifact: it
            # owns the build flags and the bundling/packaging steps, so a
            # change to it must invalidate all of them.
            server:
              - '.github/workflows/deploy.yml'
              - 'src/server/**'
              - 'src/shared/**'
              - 'src/debug/**'
              - 'src/root.zig'
              - 'build.zig'
              - 'build.zig.zon'
              - 'data/**'
            client:
              - '.github/workflows/deploy.yml'
              - 'src/client/**'
              - 'src/shared/**'
              - 'src/root.zig'
              - 'build.zig'
              - 'build.zig.zon'
              - 'bridge/**'
              - 'data/**'
            web:
              - '.github/workflows/deploy.yml'
              - 'web/**'
              - 'data/**'
            setup:
              - '.github/workflows/deploy.yml'
              - 'scripts/vps-setup.sh'

  build-server:
    needs: changes
    if: needs.changes.outputs.server == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install zig
        uses: mlugg/setup-zig@v2

      - name: unit tests
        run: zig build test

      - name: build server (ReleaseSafe)
        run: zig build server -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: zig-out/bin/server
          retention-days: 7

  # ------------------------------------------------------------------
  # Build client — compiles the headless Zig binary (Linux x86-64) and
  # bundles it with the Node bridge so they can be deployed together.
  # No Raylib, no WASM, no Emscripten.
  # ------------------------------------------------------------------

  build-client:
    needs: changes
    if: needs.changes.outputs.client == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install zig
        uses: mlugg/setup-zig@v2

      - name: build client (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: bridge/package-lock.json

      - name: install bridge npm deps
        run: npm ci
        working-directory: bridge

      - name: bundle client artifact
        run: |
          mkdir -p deploy/bridge deploy/zig-out/bin
          cp zig-out/bin/client          deploy/zig-out/bin/client
          # All bridge modules — index.js require()s session.js/controllers.js.
          cp bridge/*.js                 deploy/bridge/
          cp bridge/package.json         deploy/bridge/package.json
          cp bridge/package-lock.json    deploy/bridge/package-lock.json
          cp -r bridge/node_modules      deploy/bridge/node_modules
          cp -r data                     deploy/data

      - name: upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: deploy/
          retention-days: 7

  # ------------------------------------------------------------------
  # Deploy jobs
  # ------------------------------------------------------------------

  deploy-server:
    needs: [changes, build-server]
    if: needs.changes.outputs.server == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - name: download server artifact
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: deploy/

      - name: scp server binary to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/server"
          target: "/tmp/dragoncon-deploy/zig-out/bin/"
          strip_components: 1

      - name: install binary
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # No service restart: the bridge spawns a server process per lobby,
            # so new lobbies pick up the new binary automatically.
            sudo /usr/bin/install -o dragoncon -g dragoncon -m 755 \
              /tmp/dragoncon-deploy/zig-out/bin/server \
              /opt/dragoncon/server
            rm -rf /tmp/dragoncon-deploy

  deploy-client:
    needs: [changes, build-client]
    if: needs.changes.outputs.client == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - name: download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client-bundle
          path: deploy/

      - name: scp client bundle to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/tmp/dragoncon-deploy/"
          strip_components: 1

      - name: install client binary + bridge and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo /usr/bin/install -o dragoncon -g dragoncon -m 755 \
              /tmp/dragoncon-deploy/zig-out/bin/client \
              /opt/dragoncon/client
            sudo rsync -a --delete /tmp/dragoncon-deploy/bridge/ /opt/dragoncon/bridge/
            # Game data: bridge serves /data/* from here and passes it to
            # spawned servers via --data-dir.
            sudo rsync -a --delete /tmp/dragoncon-deploy/data/ /opt/dragoncon/data/
            sudo systemctl restart dragoncon-bridge
            rm -rf /tmp/dragoncon-deploy

  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Every ?v=dev in every shell, not one named script. The game shell now
      # loads two files (palette.js before game.js) and they have to be busted
      # TOGETHER: a fresh game.js against a cached palette.js is worse than
      # both being stale, because the two are one program split across two
      # requests. Matching the marker rather than the filename also means the
      # next script added to either page is stamped without anyone remembering
      # to come back here — and it picks up onboard.html, which this step had
      # simply never covered.
      - name: stamp cache buster with commit sha
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::12}/g" web/*.html

      - name: scp static web assets to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "web/*"
          target: "/var/www/dragoncon/"
          strip_components: 1

      # The browser fetches data/balance.json relative to the web root, so
      # the game data files ship alongside the static assets too.
      - name: scp game data to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "data/*"
          target: "/var/www/dragoncon/data/"
          strip_components: 1

  deploy-setup:
    needs: changes
    if: needs.changes.outputs.setup == 'true' || inputs.deploy_all == true
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: push setup script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "scripts/vps-setup.sh"
          target: "~/"
          strip_components: 1
