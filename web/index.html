<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slime Feast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
<canvas id="canvas" width="1024" height="768"></canvas>
<!-- ?v= is a cache buster: CI rewrites "dev" to the commit SHA on deploy.
     Absolute path: this shell is also served at /config/{hash}. -->
<script src="/game.js?v=dev"></script>
</body>
</html>
