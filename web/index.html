<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slime Feast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same paper white as the game shell (LAYOUT.slimeField.paper): a kiosk
       that lands here and then taps through to /game should not flash a
       different background on the way. */
    html, body {
      background: rgb(238, 242, 250);
      color: rgb(28, 32, 44);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      width: 100%;
      min-height: 100vh;
    }

    /* On the ROOT, not on the tiles: `manipulation` kills double-tap-to-zoom,
       and a kiosk browser has no address bar and no keyboard, so a zoom landed
       by accident is one an attendee cannot undo.  Scoping it to the tiles
       would leave the header and the grid gaps — most of a 1024x600 panel —
       still zoomable. */
    html { touch-action: manipulation; }

    /* Every tap target. Kill the browser's grey tap flash (we draw our own
       :active state), and kill text selection — a long press on a link
       otherwise pops a selection handle and a context menu that an attendee
       has no way to dismiss. */
    a, button {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 32px clamp(20px, 5vw, 64px);
    }

    header { text-align: center; }
    h1 {
      font-size: clamp(30px, 5.5vw, 52px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      margin-top: 8px;
      font-size: clamp(15px, 2vw, 20px);
      color: rgb(110, 118, 138);
    }

    /* auto-fit rather than a fixed column count: wide landscape panels (the
       1024x600 kiosk) get one row of three, a portrait tablet stacks them,
       and neither case needs a media query. */
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(16px, 2.5vw, 28px);
    }

    /* The whole tile is the anchor, not a link nested inside a box: padding
       that is not part of the hit area is a strip of the button that visibly
       looks pressable and silently is not. */
    a.tile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: clamp(180px, 30vh, 260px);
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 2px solid rgb(206, 214, 232);
      border-radius: 18px;
      box-shadow: 0 2px 0 rgb(206, 214, 232);
      /* Only the press feedback is animated. A transition on `background`
         would smear the :active state past the release on a fast tap. */
      transition: transform 60ms ease-out;
    }
    /* :active, not :hover. A touchscreen fires :hover on tap and then leaves
       it stuck on the last-tapped element after navigation. */
    a.tile:active {
      transform: translateY(2px);
      box-shadow: none;
      background: rgb(246, 249, 255);
    }
    /* Keyboard operators (and the Pi's remote debugging) still get a focus
       ring; :focus-visible keeps it off the tiles during touch. */
    a.tile:focus-visible {
      outline: 3px solid rgb(70, 110, 220);
      outline-offset: 3px;
    }

    .tile .label {
      font-size: clamp(24px, 3.4vw, 34px);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .tile .hint {
      font-size: clamp(14px, 1.8vw, 18px);
      color: rgb(110, 118, 138);
      max-width: 22ch;
    }
    .tile .swatch {
      width: clamp(44px, 6vw, 60px);
      height: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    /* ---------------------------------------------------------------------
       The kiosk exit.  Invisible, top-left, hold five seconds.
       Hidden because it is for whoever runs the event, on the same screen an
       attendee is prodding: a labelled "Quit" button on a kiosk gets pressed.
       A long hold is the affordance instead — no label to read, and nothing
       a stray palm or a curious child completes by accident.
       It reveals a progress arc ONLY once held, so an operator who knows it
       is here gets confirmation while it stays invisible to everyone else.
       --------------------------------------------------------------------- */
    #exit {
      position: fixed;
      top: 0;
      left: 0;
      width: 96px;
      height: 96px;
      /* No background, border or text: `opacity` would still leave the arc
         invisible when it is revealed, so the button itself is simply blank
         and the arc inside it is what fades in. */
      background: none;
      border: none;
      padding: 0;
      cursor: default;
      /* Above the tiles: the grid starts below this corner on the 1024x600
         panel, but a narrow viewport stacks the tiles and the first one would
         otherwise cover the corner. */
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      /* A long press is the whole interaction, so suppress the two things a
         long press normally does on a touchscreen: the iOS callout and the
         Android/desktop context menu (also cancelled in JS, since Firefox
         ignores the property). */
      -webkit-touch-callout: none;
      touch-action: none;
    }
    #exit svg {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 120ms linear;
    }
    #exit.holding svg { opacity: 1; }
    #exit .track {
      fill: rgba(238, 242, 250, 0.9);
      stroke: rgba(28, 32, 44, 0.18);
      stroke-width: 5;
    }
    /* The arc is one CSS transition on stroke-dashoffset, not a rAF loop:
       the compositor owns the timing, so a busy main thread (the bridge
       reconnecting, a big page) cannot make the hold LOOK shorter than the
       timer that actually fires.  Its duration is set from JS so the five
       seconds is written once, in one language.
       Dropping .holding removes the transition with it, so a cancelled hold
       snaps back to empty instead of unwinding. */
    #exit .arc {
      fill: none;
      stroke: rgb(28, 32, 44);
      stroke-width: 5;
      stroke-linecap: round;
      /* 2*pi*34 — the circumference of the r=34 circle in the markup. */
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      /* Start the arc at 12 o'clock rather than 3. */
      transform: rotate(-90deg);
      transform-origin: 48px 48px;
    }
    #exit.holding .arc {
      stroke-dashoffset: 0;
      transition-property: stroke-dashoffset;
      transition-timing-function: linear;
    }

    /* Only ever seen when the exit could NOT be honoured.  Without it, a
       failed hold is indistinguishable from a hold that did not register,
       and the operator's next move is to try it ten more times. */
    #exit-msg {
      position: fixed;
      top: 100px;
      left: 8px;
      max-width: 320px;
      padding: 10px 12px;
      background: rgb(28, 32, 44);
      color: rgb(246, 249, 255);
      font-size: 13px;
      line-height: 1.4;
      border-radius: 8px;
      z-index: 2;
    }
    #exit-msg[hidden] { display: none; }
  </style>
</head>
<body>
<nav>
  <!-- One tap to a running game: /game starts a lobby on open, so there is no
       create/join screen behind this tile.  There was, and it could only be
       worked with the [C] and [J] keys — on a panel with no keyboard, which
       made Play a dead end.  Joining a specific game is /game?code=XXXXXX,
       and badges find the newest lobby by themselves. -->
  <a class="tile" href="/game">
    <span class="swatch" style="background: rgb(104, 196, 132)"></span>
    <span class="label">Scan For Substance </span>
  </a>
  <a class="tile" href="/onboard">
    <span class="swatch" style="background: rgb(228, 108, 148)"></span>
    <span class="label">Discovery</span>
  </a>
  <a class="tile" href="/powerups">
    <span class="swatch" style="background: rgb(240, 190, 70)"></span>
    <span class="label">Calibrate</span>
  </a>
</nav>

<!-- The hidden kiosk exit.  Deliberately unlabelled and not in the tab order:
     it is for the person running the event, not for whoever is standing at the
     screen.  aria-label so that anyone who does reach it is told what it does
     and that it needs holding, rather than finding an anonymous button. -->
<button id="exit" type="button" tabindex="-1"
        aria-label="Close the kiosk to the desktop — hold for five seconds">
  <svg viewBox="0 0 96 96" aria-hidden="true">
    <circle class="track" cx="48" cy="48" r="34" />
    <circle class="arc" cx="48" cy="48" r="34" />
  </svg>
</button>
<p id="exit-msg" role="status" hidden></p>

<!-- ?v= is a cache buster: CI rewrites "dev" to the commit SHA on deploy.
     The navigation above is plain anchors and does not need this file: if it
     fails to load, the three stations are still reachable and only the hidden
     exit stops working. -->
<script src="/kiosk.js?v=dev"></script>
</body>
</html>
