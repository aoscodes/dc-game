<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slime Feast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Same paper white as the game shell (LAYOUT.slimeField.paper): a kiosk
       that lands here and then taps through to /game should not flash a
       different background on the way. */
    html, body {
      background: rgb(238, 242, 250);
      color: rgb(28, 32, 44);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      width: 100%;
      min-height: 100vh;
    }

    /* On the ROOT, not on the tiles: `manipulation` kills double-tap-to-zoom,
       and a kiosk browser has no address bar and no keyboard, so a zoom landed
       by accident is one an attendee cannot undo.  Scoping it to the tiles
       would leave the header and the grid gaps — most of a 1024x600 panel —
       still zoomable. */
    html { touch-action: manipulation; }

    /* Every tap target. Kill the browser's grey tap flash (we draw our own
       :active state), and kill text selection — a long press on a link
       otherwise pops a selection handle and a context menu that an attendee
       has no way to dismiss. */
    a, button {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 32px clamp(20px, 5vw, 64px);
    }

    header { text-align: center; }
    h1 {
      font-size: clamp(30px, 5.5vw, 52px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      margin-top: 8px;
      font-size: clamp(15px, 2vw, 20px);
      color: rgb(110, 118, 138);
    }

    /* auto-fit rather than a fixed column count: wide landscape panels (the
       1024x600 kiosk) get one row of three, a portrait tablet stacks them,
       and neither case needs a media query. */
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(16px, 2.5vw, 28px);
    }

    /* The whole tile is the anchor, not a link nested inside a box: padding
       that is not part of the hit area is a strip of the button that visibly
       looks pressable and silently is not. */
    a.tile {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: clamp(180px, 30vh, 260px);
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 2px solid rgb(206, 214, 232);
      border-radius: 18px;
      box-shadow: 0 2px 0 rgb(206, 214, 232);
      /* Only the press feedback is animated. A transition on `background`
         would smear the :active state past the release on a fast tap. */
      transition: transform 60ms ease-out;
    }
    /* :active, not :hover. A touchscreen fires :hover on tap and then leaves
       it stuck on the last-tapped element after navigation. */
    a.tile:active {
      transform: translateY(2px);
      box-shadow: none;
      background: rgb(246, 249, 255);
    }
    /* Keyboard operators (and the Pi's remote debugging) still get a focus
       ring; :focus-visible keeps it off the tiles during touch. */
    a.tile:focus-visible {
      outline: 3px solid rgb(70, 110, 220);
      outline-offset: 3px;
    }

    .tile .label {
      font-size: clamp(24px, 3.4vw, 34px);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .tile .hint {
      font-size: clamp(14px, 1.8vw, 18px);
      color: rgb(110, 118, 138);
      max-width: 22ch;
    }
    .tile .swatch {
      width: clamp(44px, 6vw, 60px);
      height: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<nav>
  <!-- One tap to a running game: /game starts a lobby on open, so there is no
       create/join screen behind this tile.  There was, and it could only be
       worked with the [C] and [J] keys — on a panel with no keyboard, which
       made Play a dead end.  Joining a specific game is /game?code=XXXXXX,
       and badges find the newest lobby by themselves. -->
  <a class="tile" href="/game">
    <span class="swatch" style="background: rgb(104, 196, 132)"></span>
    <span class="label">Scan For Substance </span>
  </a>
  <a class="tile" href="/onboard">
    <span class="swatch" style="background: rgb(228, 108, 148)"></span>
    <span class="label">Discovery</span>
  </a>
  <a class="tile" href="/powerups">
    <span class="swatch" style="background: rgb(240, 190, 70)"></span>
    <span class="label">Calibrate</span>
  </a>
</nav>
</body>
</html>
