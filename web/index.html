<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DC Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    /* The backing store is 2x the design space (see LAYOUT.screen /
       LAYOUT.renderScale in game.js): CSS pins the on-screen size to the
       design space so text and tile art render at 2x device resolution. */
    canvas { display: block; image-rendering: pixelated; width: 1024px; height: 768px; }
  </style>
</head>
<body>
<canvas id="canvas" width="2048" height="1536"></canvas>
<!-- ?v= is a cache buster: CI rewrites "dev" to the commit SHA on deploy.
     Absolute path: this shell is also served at /config/{hash}. -->
<script src="/game.js?v=dev"></script>
</body>
</html>
