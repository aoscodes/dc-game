<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge Onboarding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Near-black rather than the game's paper white: this screen is three
       saturated colours edge to edge, and anything lighter than the colours
       would read as the subject instead of the frame. */
    body {
      background: rgb(8, 8, 10);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Same 2x backing store as the game (see LAYOUT in onboard.js): CSS pins
       the on-screen size to the design space so the labels stay crisp. */
    canvas { display: block; width: 1024px; height: 768px; }
  </style>
</head>
<body>
<canvas id="canvas" width="2048" height="1536"></canvas>
<!-- ?v= is a cache buster: CI rewrites "dev" to the commit SHA on deploy. -->
<script src="/onboard.js?v=dev"></script>
</body>
</html>
